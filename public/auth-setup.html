<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCG Agent – Google Anmeldung</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f10;
    color: #e8e8ea;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1a1a1e;
    border: 1px solid #2a2a30;
    border-radius: 16px;
    padding: 48px;
    max-width: 440px;
    width: 90%;
    text-align: center;
  }
  .logo { font-size: 40px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; color: #fff; }
  p { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 32px; }
  button {
    width: 100%;
    padding: 14px 24px;
    background: #4285F4;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  button:hover { background: #3367d6; }
  button:disabled { background: #333; cursor: default; }
  .status {
    margin-top: 24px;
    padding: 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .status.success { background: #0d2e1a; color: #4ade80; border: 1px solid #16a34a; display: block; }
  .status.error { background: #2e0d0d; color: #f87171; border: 1px solid #dc2626; display: block; }
  .status.info { background: #0d1e2e; color: #60a5fa; border: 1px solid #2563eb; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Google Anmeldung</h1>
  <p>Einmalige Anmeldung damit der PCG Agent direkt Google Tasks &amp; andere Google-Dienste nutzen kann – ohne dass du danach nochmal den Browser öffnen musst.</p>
  <button id="loginBtn" onclick="doLogin()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Mit Google anmelden
  </button>
  <div id="status" class="status"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDn15-D3VMuuAjqTEVgIafh2HohgASpU58",
    authDomain: "pcg-hardy-sandbox.firebaseapp.com",
    projectId: "pcg-hardy-sandbox",
    storageBucket: "pcg-hardy-sandbox.firebasestorage.app",
    messagingSenderId: "261415172337",
    appId: "1:261415172337:web:1f4b461d1d07b97138d150"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.doLogin = async function() {
    const btn = document.getElementById('loginBtn');
    const statusEl = document.getElementById('status');
    btn.disabled = true;
    btn.innerHTML = '⏳ Anmeldung läuft...';
    statusEl.className = 'status info';
    statusEl.textContent = 'Google-Fenster wird geöffnet...';

    try {
      const provider = new GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/tasks');
      provider.addScope('https://www.googleapis.com/auth/calendar.readonly');
      provider.addScope('https://www.googleapis.com/auth/gmail.readonly');
      provider.addScope('https://www.googleapis.com/auth/drive.readonly');
      provider.addScope('https://www.googleapis.com/auth/chat.messages.readonly');

      const result = await signInWithPopup(auth, provider);
      const credential = GoogleAuthProvider.credentialFromResult(result);
      const token = credential.accessToken;

      statusEl.textContent = 'Token erhalten, wird auf Server gespeichert...';

      const resp = await fetch('/api/token-sync', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await resp.json();

      if (resp.ok && data.success) {
        statusEl.className = 'status success';
        statusEl.innerHTML = '✅ Erfolgreich! Das Token ist gespeichert.<br>Du kannst diesen Tab jetzt schließen und alles im Chat steuern.';
        btn.innerHTML = '✅ Erledigt';
      } else {
        throw new Error(data.error || 'Server-Fehler');
      }
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = '❌ Fehler: ' + (err.message || String(err));
      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Nochmals versuchen';
    }
  };
</script>
</body>
</html>
